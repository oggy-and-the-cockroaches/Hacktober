<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel event log</title><style>
:root{--navy:#10233e;--blue:#2368d9;--pale:#f4f7fb;--line:#dbe3ee;--text:#172235;--muted:#627087;--red:#a72338}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--text);font:15px Arial,sans-serif}header{background:var(--navy);color:#fff;padding:20px max(24px,calc((100% - 1100px)/2))}header span{color:#9ee9c1;font-size:12px;float:right}.shell{max-width:1100px;margin:32px auto;padding:0 20px}.toolbar{display:flex;gap:12px;align-items:center;margin:20px 0}.count{color:var(--muted)}button{background:var(--blue);border:0;border-radius:6px;color:#fff;padding:9px 12px;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#edf3fb;font-size:12px;text-transform:uppercase;color:#53627a}.reason{font-weight:bold;color:var(--red)}.empty{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;color:var(--muted)}code{font-size:12px;word-break:break-word}@media(max-width:700px){table{font-size:12px}th,td{padding:8px}}
</style></head><body><header><b>Sentinel security event log</b><span>SDK audit interface</span></header><main class="shell"><h1>Monitored security decisions</h1><p>Events are recorded by Sentinel without retaining the protected payload values.</p><div class="toolbar"><button onclick="load()">Refresh</button><span id="count" class="count">Loading…</span></div><div id="content"></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const content=document.querySelector('#content'),count=document.querySelector('#count');try{const response=await fetch('/logs/events'),body=await response.json(),events=body.events||[];count.textContent=events.length+' recorded event'+(events.length===1?'':'s');if(!events.length){content.innerHTML='<div class="empty">No Sentinel violations have been recorded yet.</div>';return}content.innerHTML='<table><thead><tr><th>Event</th><th>Decision</th><th>Policy</th><th>Details</th><th>Reason</th></tr></thead><tbody>'+events.map(e=>'<tr><td>'+esc(e.event_type)+'</td><td>'+esc(e.decision)+'</td><td>'+esc(e.policy)+'</td><td><code>'+esc(e.destination||e.resource||e.data||'—')+'</code></td><td class="reason">'+esc(e.reason)+'</td></tr>').join('')+'</tbody></table>'}catch(error){count.textContent='Unable to load events';content.innerHTML='<div class="empty">The Sentinel SDK did not return event data.</div>'}}load();
</script></body></html>
