[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-rasp"
version = "0.1.0"
description = "Sentinel RASP research prototype"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100", "requests>=2.28", "PyYAML>=6", "uvicorn>=0.23"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
